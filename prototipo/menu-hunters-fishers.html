<title>Menú Hunters&amp;Fishers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Hunters&Fishers · Menú digital con pedido y pago desde la mesa
   Prototipo ViBE · Dirección "Cabaña de noche" (tema oscuro único)
   ========================================================================== */
:root{
  color-scheme:dark;
  /* Paleta */
  --carbon:#1C1915;      /* fondo */
  --superficie:#26221C;  /* tarjetas, sheets */
  --veta:#3A332A;        /* bordes, divisores */
  --hueso:#F2E8D5;       /* texto */
  --tenue:#B5A990;       /* texto secundario */
  --naranja:#E8692C;     /* acento: precios, botón principal, contador */
  --on-naranja:#1C1915;  /* texto sobre naranja */
  --pino:#2F4A3A;        /* tierra / Hunters / éxito */
  --mar:#1F6E8C;         /* superficie Fishers */
  --mar-texto:#5FB3CF;   /* texto y acentos de mariscos */
  --madera:#8B5E3C;      /* solo ornamento */
  /* Tipografía */
  --display:"Alfa Slab One","Rockwell","Roboto Slab","Rockwell Extra Bold",Georgia,"Times New Roman",serif;
  --label:"Barlow Condensed","Arial Narrow","Roboto Condensed","Helvetica Neue",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* Movimiento */
  --rebote:cubic-bezier(.34,1.56,.64,1);
  --salida:cubic-bezier(.22,1,.36,1);
  /* Gutter */
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  /* Vetas de madera (muy bajo contraste) */
  --grano:
    repeating-linear-gradient(92deg,rgba(242,232,213,.018) 0 1px,transparent 1px 13px),
    repeating-linear-gradient(88deg,rgba(0,0,0,.12) 0 2px,transparent 2px 29px),
    repeating-linear-gradient(90.6deg,rgba(139,94,60,.04) 0 7px,transparent 7px 41px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background-color:var(--carbon);
  background-image:radial-gradient(700px 520px at 62% 50%,rgba(232,105,44,.07),transparent 70%),var(--grano);
  color:var(--hueso);font-family:var(--body);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
p,h1,h2,h3,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
:focus{outline:none}
:focus-visible{outline:3px solid var(--naranja);outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.g{padding-left:var(--gl);padding-right:var(--gr)}
.amp{color:var(--naranja)}
.nowrap{white-space:nowrap}
.money{font-family:var(--label);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ic{width:20px;height:20px;flex:none;display:block}
.nt{text-transform:none}

/* ---------- Escenario: móvil a pantalla completa, escritorio con marco ---------- */
.stage{height:100vh;height:100dvh}
.pitch{display:none}
.phone{position:relative;width:100%;height:100%;overflow:hidden;overflow:clip;background-color:var(--carbon);background-image:var(--grano)}
.app{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);container-type:inline-size}
.scroller{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;position:relative;-webkit-overflow-scrolling:touch}

@media (min-width:900px){
  .stage{display:flex;align-items:center;justify-content:center;gap:72px;padding:24px}
  .pitch{display:block;max-width:340px;flex:0 1 340px}
  .phone{flex:none;width:400px;height:min(820px,calc(100dvh - 48px));border:10px solid #0E0C0A;border-radius:46px;
    box-shadow:0 0 0 1px var(--veta),0 40px 90px rgba(0,0,0,.6),0 0 0 14px rgba(58,51,42,.25)}
  .ribbon{display:none!important}
}

/* ---------- Texto lateral (solo escritorio) ---------- */
.pitch-kicker{font-family:var(--label);font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--tenue);font-size:.9rem}
.pitch-title{font-family:var(--display);font-size:2.35rem;line-height:1.06;margin:.5rem 0 1.6rem;text-wrap:balance}
.pitch-steps{display:grid;gap:16px}
.pitch-steps li{display:grid;grid-template-columns:38px 1fr;gap:14px;align-items:start;color:var(--tenue);font-size:1.02rem;line-height:1.5}
.pitch-steps b{color:var(--hueso);font-weight:600}
.pitch-n{width:38px;height:38px;border-radius:50%;border:2px solid var(--naranja);display:grid;place-items:center;font-family:var(--label);font-weight:700;color:var(--naranja);font-size:1.05rem}
.pitch-note{margin-top:26px;padding-top:16px;border-top:1px solid var(--veta);display:flex;gap:10px;align-items:center;font-family:var(--label);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:.9rem;color:var(--tenue)}
.pitch-note .ic{color:var(--naranja)}
.pitch-detail{margin-top:8px;font-size:.95rem;line-height:1.5;color:var(--tenue)}

/* ---------- Franja de prototipo (móvil) ---------- */
.ribbon{flex:none;display:flex;align-items:center;gap:6px;min-height:44px;background:var(--superficie);border-bottom:1px solid var(--veta);padding-right:0!important}
.ribbon p{flex:1;min-width:0;font-family:var(--label);font-weight:600;letter-spacing:.03em;text-transform:uppercase;font-size:.76rem;color:var(--tenue);line-height:1.25;padding:4px 0}
.ribbon p b{color:var(--hueso);font-weight:700}
.ribbon[hidden]{display:none}
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;background:none;border:0;border-radius:12px;color:var(--hueso)}
.icon-btn .ic{width:20px;height:20px}

/* ---------- Encabezado (una fila) ---------- */
.top{flex:none;display:grid;gap:6px;padding-top:6px;padding-bottom:6px;border-bottom:1px solid var(--veta);background:linear-gradient(rgba(28,25,21,.6),rgba(28,25,21,.95))}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.brand-wrap{display:grid;gap:4px;justify-items:start;min-width:0}
.brand{font-family:var(--display);font-weight:400;font-size:1.2rem;font-size:clamp(1.05rem,5cqi,1.42rem);line-height:1;letter-spacing:.005em;white-space:nowrap;min-width:0}
.top-actions{display:flex;align-items:center;gap:6px;flex:none}
.lang{display:flex;flex:none;border:1px solid var(--veta);border-radius:999px;padding:2px;background:var(--carbon)}
.lang button{min-width:44px;min-height:44px;border:0;background:none;border-radius:999px;font-family:var(--label);font-weight:700;letter-spacing:.1em;font-size:.95rem;color:var(--tenue);transition:background-color .2s,color .2s}
.lang button[aria-pressed="true"]{background:var(--hueso);color:var(--carbon)}
.table-chip{display:inline-flex;align-items:center;gap:5px;min-height:22px;font-family:var(--label);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.74rem;line-height:1;border:1px solid var(--veta);border-radius:6px;padding:0 7px;background:var(--superficie);color:var(--hueso);white-space:nowrap}
.table-chip i{width:6px;height:6px;border-radius:50%;background:var(--naranja);display:block}
.call{position:relative;width:48px;height:48px;flex:none;display:grid;place-items:center;background:var(--superficie);border:1px solid var(--veta);border-radius:50%;transition:border-color .2s,transform .15s}
.call:active{transform:scale(.95)}
.call:hover{border-color:#5A4F40}
.call .ic{color:var(--naranja);width:22px;height:22px}
.call-dot{position:absolute;top:3px;right:3px;width:12px;height:12px;border-radius:50%;background:#5FA37A;box-shadow:0 0 0 2px var(--carbon)}
.waiter-strip{display:flex;align-items:center;gap:8px;background:var(--pino);border-radius:10px;padding-left:12px;font-size:.92rem;line-height:1.3;animation:dropIn .35s var(--rebote)}
.waiter-strip .ic{width:18px;height:18px}
.waiter-strip > span{flex:1;display:flex;align-items:center;gap:8px;padding:6px 0}
.waiter-strip.in-sheet{margin-top:16px}
.link-btn{min-height:44px;padding:0 12px;background:none;border:0;color:var(--hueso);font-family:var(--label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ---------- Vista menú ---------- */
.hello{padding-top:12px}
.kicker{font-family:var(--label);font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--tenue);font-size:.82rem}
.hello h2{font-family:var(--display);font-weight:400;font-size:1.35rem;line-height:1.12;margin-top:2px;text-wrap:balance}

/* Letrero Hunters / Fishers */
.sign-wrap{position:relative;margin-top:10px;padding:10px 12px;border-radius:18px;border:1px solid var(--veta);
  background-color:var(--superficie);background-image:repeating-linear-gradient(91deg,rgba(242,232,213,.025) 0 1px,transparent 1px 9px),repeating-linear-gradient(89deg,rgba(0,0,0,.14) 0 2px,transparent 2px 23px);
  box-shadow:inset 0 1px 0 rgba(242,232,213,.05),0 6px 16px rgba(0,0,0,.25)}
.sign-wrap::before,.sign-wrap::after{content:"";position:absolute;top:7px;width:6px;height:6px;border-radius:50%;background:var(--madera);box-shadow:inset 0 -1px 0 rgba(0,0,0,.4)}
.sign-wrap::before{left:8px}.sign-wrap::after{right:8px}
.sign{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--carbon);border:1px solid var(--veta);border-radius:999px;padding:5px;box-shadow:inset 0 2px 8px rgba(0,0,0,.45);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.sign button{position:relative;z-index:1;min-height:50px;border:0;background:none;border-radius:999px;color:var(--tenue);font-family:var(--label);font-weight:700;font-size:1.2rem;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;transition:color .25s}
.sign button .emo{width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--carbon);box-shadow:inset 0 0 0 1px rgba(242,232,213,.12);font-size:1.1rem;line-height:1;letter-spacing:0}
.sign button[aria-pressed="true"]{color:var(--on-naranja)}
.sign[data-side="fishers"] button[aria-pressed="true"]{color:var(--hueso)}
.knob{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:999px;background:var(--naranja);
  transition:transform .45s var(--rebote),background-color .3s;box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.sign[data-side="fishers"] .knob{transform:translateX(100%);background:var(--mar)}
.sign-desc{margin-top:8px;text-align:center;font-size:.93rem;color:var(--tenue);min-height:1.5em}

/* Chips de categoría */
.chips{position:sticky;top:0;z-index:6;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:none;
  margin-top:8px;padding-top:8px;padding-bottom:8px;background:var(--carbon);border-bottom:1px solid transparent;transition:border-color .2s}
.chips::-webkit-scrollbar{display:none}
.chips::after{content:"";flex:0 0 1px}
.chips.stuck{border-bottom-color:var(--veta);box-shadow:0 8px 16px -10px rgba(0,0,0,.7)}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--veta);background:var(--superficie);color:var(--hueso);
  font-family:var(--label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.93rem;white-space:nowrap;transition:background-color .2s,border-color .2s}
.chip[aria-current="true"]{background:var(--pino);border-color:#4B6B58}
.side-fishers .chip[aria-current="true"]{background:var(--mar);border-color:#2C86A8}

/* Secciones */
.sections.in-h .sec{animation:inL .34s var(--salida) both}
.sections.in-f .sec{animation:inR .34s var(--salida) both}
@keyframes inL{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.sec{padding-top:18px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sec-head::after{content:"";flex:1;min-width:16px;height:2px;align-self:center;margin-top:14px;background:repeating-linear-gradient(90deg,var(--veta) 0 7px,transparent 7px 11px)}
.sec-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--pino);color:var(--hueso);box-shadow:inset 0 0 0 1px rgba(242,232,213,.08)}
.sec-ico .ic{width:28px;height:28px}
.sec-fishers .sec-ico{background:var(--mar)}
.sec-both .sec-ico{background:var(--veta);box-shadow:inset 0 0 0 1px var(--madera)}
.sec-head h2{font-family:var(--display);font-weight:400;font-size:1.32rem;line-height:1.1}
.sec-fishers .kicker{color:var(--mar-texto)}

.dish-list{display:grid;gap:10px}
.dish{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:14px;width:100%;text-align:left;background-color:var(--superficie);background-image:var(--grano);border:1px solid var(--veta);border-radius:14px;padding:15px 14px 14px;
  box-shadow:inset 0 0 0 4px var(--superficie),inset 0 0 0 5px rgba(139,94,60,.5),0 4px 12px rgba(0,0,0,.22);transition:transform .2s var(--rebote),border-color .2s}
/* Placa de trofeo: dos tornillos de madera */
.dish::before,.dish::after{content:"";position:absolute;top:8px;width:5px;height:5px;border-radius:50%;background:var(--madera);box-shadow:inset 0 -1px 0 rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.25)}
.dish::before{left:8px}.dish::after{right:8px}
.dish:hover{border-color:#51473A}
.dish:active{transform:scale(.985)}
.dish .photo{order:2;width:104px;height:104px;align-self:start}
.dish-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.dish-name{font-family:var(--display);font-size:1.08rem;line-height:1.16;overflow-wrap:anywhere}
.dish-desc{font-size:.9rem;line-height:1.38;color:var(--tenue);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dish-foot{margin-top:auto;padding-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.price{font-family:var(--label);font-weight:700;font-size:1.18rem;color:var(--naranja);font-variant-numeric:tabular-nums;white-space:nowrap}
.star{color:var(--naranja);margin-left:1px}
.plus{margin-left:auto;width:34px;height:34px;border-radius:50%;background:transparent;border:1.5px solid rgba(242,232,213,.6);color:var(--hueso);display:grid;place-items:center;flex:none;transition:transform .25s var(--rebote),border-color .2s}
.plus .ic{width:18px;height:18px;stroke-width:2.6}
.dish:hover .plus{transform:scale(1.08);border-color:var(--hueso)}
.dish.feature{grid-template-columns:1fr}
.dish.feature .photo{order:0;width:100%;height:auto;aspect-ratio:16/6.5}
/* En la destacada, el precio va justo bajo el nombre para que se vea sin hacer scroll */
.dish.feature .dish-foot{order:1;margin-top:0;padding-top:2px}
.dish.feature .dish-desc{order:2}
.dish.feature .dish-name{font-size:1.3rem}
.tag{align-self:flex-start;font-family:var(--label);font-weight:700;font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;padding:1px 8px;border-radius:4px;border:1px solid var(--madera);background:rgba(139,94,60,.22);color:var(--hueso)}
.tag-fishers{color:var(--mar-texto);border-color:currentColor;background:rgba(31,110,140,.16)}
.serves{font-family:var(--label);font-weight:600;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue);border:1px solid var(--veta);border-radius:4px;padding:1px 7px}
.footnote{margin-top:22px;font-size:.85rem;color:var(--tenue)}
.footnote b{color:var(--naranja)}

/* Foto ilustrada de ejemplo */
.photo{position:relative;display:grid;place-items:center;overflow:hidden;border-radius:10px;color:rgba(242,232,213,.86);
  background-image:
    repeating-linear-gradient(100deg,transparent 0 7px,rgba(0,0,0,.11) 7px 8px,transparent 8px 15px,rgba(255,240,220,.05) 15px 16px),
    radial-gradient(120% 90% at var(--lx,28%) var(--ly,18%),rgba(232,105,44,.5),rgba(232,105,44,0) 62%),
    linear-gradient(150deg,#6E4529,#3C291B 55%,#241A12)}
.photo.ph-fishers{background-image:
    repeating-linear-gradient(100deg,transparent 0 7px,rgba(0,0,0,.12) 7px 8px,transparent 8px 15px,rgba(255,240,220,.05) 15px 16px),
    radial-gradient(90% 80% at var(--lx,78%) var(--ly,14%),rgba(232,105,44,.32),rgba(232,105,44,0) 60%),
    linear-gradient(150deg,#1F6E8C,#17495C 52%,#132A33)}
.photo.ph-both{background-image:
    repeating-linear-gradient(100deg,transparent 0 7px,rgba(0,0,0,.12) 7px 8px,transparent 8px 15px,rgba(255,240,220,.05) 15px 16px),
    radial-gradient(100% 90% at var(--lx,50%) var(--ly,10%),rgba(255,186,84,.42),rgba(255,186,84,0) 62%),
    linear-gradient(150deg,#8A5A1F,#57391A 55%,#2A1D10)}
.photo::before{content:"";position:absolute;width:74%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(242,232,213,.14);background:radial-gradient(circle,rgba(0,0,0,.18),rgba(0,0,0,.05) 70%)}
.photo .ic{position:relative;width:46%;height:auto;aspect-ratio:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3));transform:rotate(var(--rot,0deg))}
.dish.feature .photo::before,.ph-hero::before{width:auto;height:76%}
.dish.feature .photo .ic,.ph-hero .ic{width:auto;height:42%}
.ph-tag{position:absolute;left:5px;bottom:5px;white-space:nowrap;font-family:var(--label);font-weight:600;font-size:.64rem;letter-spacing:.04em;text-transform:uppercase;background:rgba(28,25,21,.8);color:var(--hueso);padding:2px 6px;border-radius:4px;line-height:1.3}
.ph-hero{border-radius:0;aspect-ratio:16/9;width:100%}
.ph-hero .ph-tag,.dish.feature .ph-tag{left:var(--gl);bottom:10px;font-size:.74rem;letter-spacing:.08em}
.dish.feature .ph-tag{left:10px}
.dish:not(.feature) .ph-tag{left:0;right:0;bottom:0;border-radius:0;text-align:center;white-space:normal;padding:3px 4px;font-size:.7rem;letter-spacing:.06em;background:rgba(28,25,21,.78)}
.dish .photo .ic{margin-top:-12px}
.dish.feature .photo .ic,.ph-hero .ic{margin-top:0}

/* Tarjeta de estado en el menú */
.mstatus{margin-top:14px;background:var(--superficie);border:1px solid var(--veta);border-radius:14px;padding:12px 14px;display:grid;gap:10px}

/* ---------- Barra inferior (canoa / total) ---------- */
.bar{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  background-color:var(--carbon);background-image:var(--grano);border-top:1px solid var(--veta);box-shadow:0 -10px 24px rgba(0,0,0,.35);
  animation:barIn .3s var(--salida)}
.bar[hidden]{display:none}
@keyframes barIn{from{transform:translateY(100%)}to{transform:none}}
.bar-canoe{position:relative;width:64px;height:32px;flex:none;transform-origin:50% 70%}
.bar-canoe svg{width:100%;height:100%;display:block;overflow:visible}
.bar-canoe.bob{animation:bob .6s ease-out}
@keyframes bob{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(5px) rotate(-3deg)}55%{transform:translateY(-2px) rotate(2deg)}100%{transform:translateY(0) rotate(0)}}
.badge{position:absolute;top:-10px;right:-4px;min-width:24px;height:24px;border-radius:12px;background:var(--naranja);color:var(--on-naranja);font-family:var(--label);font-weight:700;font-size:.9rem;display:flex;align-items:center;justify-content:center;padding:0 6px;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--carbon)}
.badge.zero{background:var(--veta);color:var(--hueso)}
.bar-canoe.bob .badge{animation:pop .45s var(--rebote)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.bar-info{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.bar-label{font-family:var(--label);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:.82rem;color:var(--tenue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-amt{font-family:var(--label);font-weight:700;font-size:1.3rem;color:var(--naranja);font-variant-numeric:tabular-nums}
.bar-empty{font-size:.9rem;color:var(--hueso)}
.bar .btn{flex:none}

/* ---------- Cuenta ---------- */
function billLines() {
  const out = [];
  state.rounds.forEach(r => r.lines.forEach((l, i) => out.push(Object.assign({}, l, { id: r.n + '-' + i, round: r.n }))));
  return out;
}
function calc() {
  const lines = billLines();
  const sub = lines.reduce((a, l) => a + l.unit * l.qty, 0);
  let tip = 0, tipLabel = '';
  if (state.tip.mode === 'pct') { tip = Math.round(sub * state.tip.pct / 100); tipLabel = ` (${state.tip.pct}%)`; }
  else if (state.tip.mode === 'custom') tip = state.tip.err ? 0 : state.tip.cents;
  else if (state.tip.mode === 'unset') tipLabel = '';
  const total = sub + tip;
  /* Partes iguales: centavos exactos; los `rem` centavos sobrantes se reparten de uno en uno */
  const n = state.split.n;
  const each = Math.floor(total / n);
  const rem = total - each * n;
  /* Por persona */
  const P = state.split.people;
  const pSub = new Array(P).fill(0);
  let unN = 0, unAmt = 0;
  lines.forEach(l => {
    const amt = l.unit * l.qty;
    const who = (state.split.assign[l.id] || []).filter(p => p < P).sort((a, b) => a - b);
    if (!who.length) { unN++; unAmt += amt; return; }
    const share = Math.floor(amt / who.length);
    let r = amt - share * who.length;
    who.forEach(p => { pSub[p] += share + (r > 0 ? 1 : 0); if (r > 0) r--; });
  });
  const assigned = sub - unAmt;
  const pTip = new Array(P).fill(0);
  if (assigned > 0 && tip > 0) {
    const raw = pSub.map(s => tip * s / assigned);
    const fl = raw.map(Math.floor);
    let left = tip - fl.reduce((a, b) => a + b, 0);
    raw.map((v, i) => [v - fl[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (left > 0) { fl[i]++; left--; } });
    fl.forEach((v, i) => { pTip[i] = v; });
  }
  const persons = pSub.map((s, i) => ({ sub: s, tip: pTip[i], total: s + pTip[i] }));
  const canPay = sub > 0 && !(state.tip.mode === 'custom' && state.tip.err) && !(state.split.mode === 'person' && unN > 0);
  return { lines, sub, tip, tipLabel, total, n, each, rem, P, persons, unN, unAmt, canPay };
}

    </div>
    <div class="sheet-scroll">
      ${state.waiter ? `<div class="g"><div class="waiter-strip in-sheet"><span>${icon('check')}<span class="waiter-text">${waiterText()}</span></span><button type="button" class="link-btn" data-act="waiter-clear">${t('waiter_done')}</button></div></div>` : ''}
      <div class="reasons g">${reasons.map(([k, ic]) =>
        `<button type="button" class="reason" data-act="waiter-send" data-arg="${k}"><span class="reason-ico">${icon(ic)}</span><span>${t('w_' + k)}</span></button>`).join('')}</div>
    </div>`;
}
function renderSheet() {
  const k = state.sheet;
  if (!k) return;
  sheetEl.className = 'sheet sheet-' + k + (k === 'cart' ? ' tall' : '');
  sheetEl.innerHTML = k === 'detail' ? detailHTML() : k === 'cart' ? cartHTML() : waiterHTML();
}
let lastFocus = null, sheetTimer = 0;
function openSheet(kind, opener) {
  clearTimeout(sheetTimer);
  state.sheet = kind;
  lastFocus = opener || document.activeElement;
  renderSheet();
  layer.hidden = false;
  app.inert = true;
  app.setAttribute('aria-hidden', 'true');
  void layer.offsetWidth;
  layer.classList.add('open');
  const title = $('sheet-title');
  if (title) title.focus({ preventScroll: true });
}
function closeSheet(restore) {
  if (!state.sheet) return;
  state.sheet = null;
  layer.classList.remove('open');
  app.inert = false;
  app.removeAttribute('aria-hidden');
  sheetTimer = setTimeout(() => { layer.hidden = true; sheetEl.innerHTML = ''; }, RM.matches ? 0 : 300);
  if (restore === false || !lastFocus) return;
  let f = lastFocus.isConnected ? lastFocus : null;
  /* Si el botón que abrió el sheet se volvió a pintar, busca su equivalente */
  if (!f && lastFocus.dataset && lastFocus.dataset.act) f = document.querySelector(`[data-act="${lastFocus.dataset.act}"]`);
  if (f) f.focus({ preventScroll: true });
}

function renderAll() {
  document.documentElement.lang = state.lang === 'es' ? 'es-MX' : 'en';
  document.title = t('doc_title');
  renderPitch();
  renderRibbon();
  renderHeader();
  renderView();
  renderBar();
  if (state.sheet) renderSheet();
}

/* ==========================================================================
   Navegación y chips (scroll spy)
   ========================================================================== */
let activeChip = null, spyRaf = 0;
function setActiveChip(id) {
  if (activeChip === id) return;
  activeChip = id;
  const chips = $('chips');
  if (!chips) return;
  let target = null;
  chips.querySelectorAll('.chip').forEach(b => {
    const on = b.dataset.arg === id;
    b.setAttribute('aria-current', on ? 'true' : 'false');
    if (on) target = b;
  });
  if (target) {
    const cr = chips.getBoundingClientRect(), br = target.getBoundingClientRect();
    if (br.left < cr.left + 16 || br.right > cr.right - 16) {
      chips.scrollTo({ left: chips.scrollLeft + (br.left - cr.left) - 16, behavior: behavior() });
    }
  }
}
function spy() {
  if (state.view !== 'menu') return;
  const chips = $('chips');
  if (!chips) return;
  const sr = scroller.getBoundingClientRect();
  const cr = chips.getBoundingClientRect();
  chips.classList.toggle('stuck', cr.top <= sr.top + 0.5 && scroller.scrollTop > 0);
  const secs = scroller.querySelectorAll('.sec');
  if (!secs.length) return;
  let cur = secs[0].id.slice(4);
  const lim = cr.bottom + 24;
  secs.forEach(s => { if (s.getBoundingClientRect().top <= lim) cur = s.id.slice(4); });
  if (scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 4) cur = secs[secs.length - 1].id.slice(4);
  setActiveChip(cur);
}
scroller.addEventListener('scroll', () => {
  if (spyRaf) return;
  spyRaf = requestAnimationFrame(() => { spyRaf = 0; spy(); });
}, { passive: true });

function scrollToSection(id) {
  const sec = $('sec-' + id), chips = $('chips');
  if (!sec || !chips) return;
  const top = sec.getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop - chips.offsetHeight + 6;
  scroller.scrollTo({ top: Math.max(0, top), behavior: behavior() });
  setActiveChip(id);
}
function goView(v) {
  /* Salir de Pago cancela una simulación en curso */
  if (state.view === 'pay' && v !== 'pay') { clearTimeout(payTimer); state.pay.processing = false; }
  state.view = v;
  renderView();
  renderBar();
  scroller.scrollTop = 0;
  const h = $('view-title');
  if (h) h.focus({ preventScroll: true });
}

/* ==========================================================================
   Acciones
   ========================================================================== */
function setLang(lang) {
  if (typeof live !== 'undefined' && live) live.textContent = '';
  if (state.lang === lang) return;
  const top = scroller.scrollTop;
  state.lang = lang;
  keepFocus(renderAll);
  retranslateToasts();
  scroller.scrollTop = top;
  spy();
}
function setSide(side) {
  if (state.side === side || state.view !== 'menu') return;
  state.side = side;
  const sign = $('sign');
  sign.dataset.side = side;
  sign.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.arg === side)));
  $('view-menu').className = 'view-menu side-' + side;
  $('sign-desc').textContent = t(side === 'hunters' ? 'side_h_desc' : 'side_f_desc');
  $('view-title').textContent = t(side === 'hunters' ? 'hello_h' : 'hello_f');
  const chips = $('chips');
  chips.innerHTML = chipsHTML();
  chips.scrollLeft = 0;
  activeChip = null;
  const secs = $('sections');
  secs.innerHTML = sectionsHTML();
  secs.classList.remove('in-h', 'in-f');
  void secs.offsetWidth;
  secs.classList.add(side === 'hunters' ? 'in-h' : 'in-f');
  /* Si ya bajaste, vuelve al inicio de las secciones (chips arriba) */
  const wrap = $('sign-wrap');
  const natural = wrap.getBoundingClientRect().bottom - scroller.getBoundingClientRect().top + scroller.scrollTop + 12;
  if (scroller.scrollTop > natural) scroller.scrollTop = natural;
  spy();
  announce(t(side === 'hunters' ? 'side_h_desc' : 'side_f_desc'));
}
function openDetail(id, opener) {
  state.draft = { itemId: id, qty: 1, opt: null, note: '', err: false };
  openSheet('detail', opener);
}
function updateDraftQty(delta) {
  const d = state.draft;
  if (!d) return;
  d.qty = Math.min(MAX_QTY, Math.max(1, d.qty + delta));
  $('d-qty').textContent = d.qty;
  const btns = sheetEl.querySelectorAll('[data-act="d-qty"]');
  btns[0].disabled = d.qty <= 1;
  btns[1].disabled = d.qty >= MAX_QTY;
  if (document.activeElement && document.activeElement.disabled) btns[d.qty <= 1 ? 1 : 0].focus({ preventScroll: true });
  $('d-add').textContent = t('add_btn', { price: money(ITEMS[d.itemId].price * 100 * d.qty) });
}
function addDraft(btn) {
  /* Guarda contra doble toque: el sheet ya se está cerrando */
  if (state.sheet !== 'detail' || !state.draft) return;
  const d = state.draft, it = ITEMS[d.itemId];
  if (it.opt && !d.opt) {
    d.err = true;
    const f = $('d-opt');
    f.classList.add('has-err');
    $('d-opt-err').innerHTML = optErrHTML();
    const sc = $('sheet-scroll');
    sc.scrollTo({ top: Math.max(0, f.offsetTop - 16), behavior: behavior() });
    f.querySelector('input').focus({ preventScroll: true });
    return;
  }
  const note = d.note.trim().slice(0, 140);
  const key = [it.id, d.opt || '', note].join('|');
  const ex = state.cart.find(l => l.key === key);
  let capped = false;
  if (ex) { capped = ex.qty + d.qty > MAX_QTY; ex.qty = Math.min(MAX_QTY, ex.qty + d.qty); }
  else state.cart.push({ key, itemId: it.id, opt: d.opt, note, qty: d.qty, unit: it.price * 100 });
  state.draft = null;
  const from = btn.getBoundingClientRect();
  const name = L(it.name);
  closeSheet(true);
  if (capped) toast('max_qty', { n: MAX_QTY }, 'alert');
  flyToCanoe(from, () => {
    keepFocus(renderBar);
    bob();
    announce(t('added', { name, count: itemsLabel(cartCount()) }));
  });
}
function flyToCanoe(from, done) {
  const target = $('bar-canoe');
  if (RM.matches || !target || typeof Element.prototype.animate !== 'function') { done(); return; }
  const pr = phone.getBoundingClientRect(), tr = target.getBoundingClientRect();
  const sx = from.left + from.width / 2 - pr.left, sy = from.top + from.height / 2 - pr.top;
  const ex = tr.left + tr.width / 2 - pr.left, ey = tr.top + tr.height * 0.45 - pr.top;
  const dot = document.createElement('span');
  dot.className = 'dot';
  dot.style.left = (sx - 8) + 'px';
  dot.style.top = (sy - 8) + 'px';
  phone.appendChild(dot);
  const dx = ex - sx, dy = ey - sy;
  const anim = dot.animate([
    { transform: 'translate(0,0) scale(1)', opacity: 1, easing: 'cubic-bezier(.2,.7,.4,1)' },
    { transform: `translate(${dx * 0.45}px,${Math.min(dy, 0) - 70}px) scale(1.1)`, opacity: 1, offset: 0.42, easing: 'cubic-bezier(.5,0,.75,0)' },
    { transform: `translate(${dx}px,${dy}px) scale(.5)`, opacity: 0.9 }
  ], { duration: 560, fill: 'forwards' });
  let finished = false;
  const end = () => { if (finished) return; finished = true; dot.remove(); done(); };
  anim.onfinish = end;
  setTimeout(end, 800);
}
function bob() {
  const c = $('bar-canoe');
  if (!c) return;
  c.classList.remove('bob');
  void c.offsetWidth;
  c.classList.add('bob');
}
function changeLine(i, delta) {
  const l = state.cart[i];
  if (!l) return;
  l.qty = Math.min(MAX_QTY, Math.max(1, l.qty + delta));
  keepFocus(() => { renderSheet(); renderBar(); });
  const el = document.activeElement;
  if (el && el.disabled) {
    const other = sheetEl.querySelector(`[data-act="line-qty"][data-arg="${i}:${delta > 0 ? -1 : 1}"]`);
    if (other) other.focus({ preventScroll: true });
  }
}
function removeLine(i) {
  const l = state.cart[i];
  if (!l) return;
  const nm = lineName(l);
  state.cart.splice(i, 1);
  renderSheet();
  renderBar();
  const next = sheetEl.querySelector(`[data-act="line-del"][data-arg="${Math.min(i, state.cart.length - 1)}"]`) || $('sheet-title');
  if (next) next.focus({ preventScroll: true });
  announce(t('line_removed', { name: nm }));
}
function sendOrder() {
  if (!state.cart.length) return;
  const n = state.rounds.length + 1;
  state.rounds.push({ n, lines: state.cart.map(l => Object.assign({}, l)), at: Date.now(), step: 0, done: false });
  state.cart = [];
  closeSheet(false);
  goView('status');
  toast('toast_sent', { n }, 'send');
  ensureTick();
}
function sendWaiter(reason) {
  if (state.sheet !== 'waiter') return;
  state.waiter = { at: Date.now(), reason, shown: 0, collapsed: false };
  closeSheet(false);
  renderHeader();
  const b = document.querySelector('[data-act="waiter-open"]');
  if (b) b.focus({ preventScroll: true });
  toast('toast_waiter', null, 'bell');
  ensureTick();
}
function setTip(arg) {
  if (arg === 'none') state.tip.mode = 'none';
  else if (arg === 'custom') state.tip.mode = 'custom';
  else { state.tip.mode = 'pct'; state.tip.pct = Number(arg); }
  const top = scroller.scrollTop;
  keepFocus(() => { renderView(); renderBar(); });
  scroller.scrollTop = top;
  if (arg === 'custom') { const inp = $('tip-input'); if (inp) inp.focus({ preventScroll: true }); }
}
/* Acepta 150, 150.50, 1,500.00 y coma decimal (50,50 = 50.50). Devuelve centavos o null */
function parseTip(v) {
  let s = v.trim().replace(/[$\s]/g, '');
  if (s === '') return 0;
  if (/^\d+,\d{0,2}$/.test(s)) s = s.replace(',', '.');
  else if (/^\d{1,3}(,\d{3})+(\.\d{0,2})?$/.test(s)) s = s.replace(/,/g, '');
  if (!/^\d{1,6}(\.\d{0,2})?$/.test(s)) return null;
  return Math.round(parseFloat(s) * 100);
}
function onTipInput(v) {
  state.tip.raw = v;
  const cents = parseTip(v);
  const sub = calc().sub;
  state.tip.cents = cents == null ? 0 : cents;
  state.tip.err = cents == null ? 'fmt' : cents > sub ? 'high' : '';
  const inp = $('tip-input');
  inp.setAttribute('aria-invalid', String(!!state.tip.err));
  $('tip-err').innerHTML = tipErrHTML();
  refreshBillDyn();
}
function refreshBillDyn() {
  const dyn = $('bill-dyn');
  if (!dyn) return;
  keepFocus(() => { dyn.innerHTML = billDynHTML(calc()); renderBar(); });
}
function finishPayment(method) {
  const b = calc();
  state.paid = { method, b, rounds: state.rounds.length, splitMode: state.split.mode };
  state.pay.processing = false;
  /* Fin de la visita: sin toasts pendientes, sin aviso de mesero, rondas cerradas */
  state.rounds.forEach(r => { r.step = 2; r.done = true; });
  state.waiter = null;
  clearInterval(tickId); tickId = 0;
  clearToasts();
  renderHeader();
  goView('done');
  announce(t(method === 'online' ? 'toast_paid' : 'toast_waiter'));
}
function restart() {
  const lang = state.lang, ribbon = state.ribbon;
  clearInterval(tickId); tickId = 0;
  clearTimeout(payTimer);
  if (state.sheet) closeSheet(false);
  state = freshState(lang);
  state.ribbon = ribbon;
  clearToasts();
  renderAll();
  scroller.scrollTop = 0;
  const h = $('view-title');
  if (h) h.focus({ preventScroll: true });
  toast('toast_restart', null, 'restart');
}

/* ---------- Reloj de la demo (avance del pedido y aviso al mesero) ---------- */
let tickId = 0, payTimer = 0;
function ensureTick() { if (!tickId) tickId = setInterval(tick, 500); }
function tick() {
  const now = Date.now();
  state.rounds.forEach(r => {
    const s = Math.min(2, Math.floor((now - r.at) / STEP_MS));
    if (s !== r.step) {
      r.step = s;
      updateRoundDom(r);
      announce(t('round_n', { n: r.n }) + ': ' + t('st' + s));
      if (s === 2 && !r.done) { r.done = true; toast('toast_enjoy'); }
    }
  });
  if (state.waiter) {
    const w = state.waiter, m = waiterMins();
    if (m !== w.shown) {
      w.shown = m;
      document.querySelectorAll('.waiter-text').forEach(el => { el.textContent = waiterText(); });
      const cb = $('call-btn');
      if (cb) cb.setAttribute('aria-label', t('call_waiter') + ' · ' + waiterText());
    }
    if (!w.collapsed && now - w.at > WAITER_STRIP_MS) {
      w.collapsed = true;
      const hadFocus = $('top').contains(document.activeElement);
      renderHeader();
      if (hadFocus) $('call-btn').focus({ preventScroll: true });
    }
  }
  if (!state.waiter && state.rounds.every(r => r.done)) { clearInterval(tickId); tickId = 0; }
}
function updateRoundDom(r) {
  document.querySelectorAll(`[data-round="${r.n}"]`).forEach(el => {
    const fill = el.querySelector('.sedal i');
    if (fill) fill.style.width = SEDAL_W[r.step];
    el.querySelectorAll('.step').forEach((s, i) => {
      s.classList.toggle('on', i <= r.step); s.classList.toggle('now', i === r.step);
      if (i === r.step) s.setAttribute('aria-current', 'step'); else s.removeAttribute('aria-current');
    });
    const st = el.querySelector('.round-state');
    if (st) { st.textContent = t('st' + r.step); st.dataset.step = r.step; }
  });
}

/* ==========================================================================
   Eventos (delegación)
   ========================================================================== */
let swipedAt = 0;
const ACTIONS = {
  'lang': (el) => setLang(el.dataset.arg),
  'ribbon-close': () => {
    state.ribbon = false;
    renderRibbon();
    measureChrome();
    const b = document.querySelector('[data-act="lang"][aria-pressed="true"]');
    if (b) b.focus({ preventScroll: true });
  },
  'waiter-open': (el) => openSheet('waiter', el),
  'waiter-send': (el) => sendWaiter(el.dataset.arg),
  'waiter-clear': () => {
    state.waiter = null;
    renderHeader();
    if (state.sheet === 'waiter') { renderSheet(); const h = $('sheet-title'); if (h) h.focus({ preventScroll: true }); return; }
    const b = $('call-btn');
    if (b) b.focus({ preventScroll: true });
  },
  'side': (el) => { if (performance.now() - swipedAt > 400) setSide(el.dataset.arg); },
  'chip': (el) => scrollToSection(el.dataset.arg),
  'item': (el) => openDetail(el.dataset.arg, el),
  'd-qty': (el) => updateDraftQty(Number(el.dataset.arg)),
  'd-add': (el) => addDraft(el),
  'sheet-close': () => closeSheet(true),
  'cart-open': (el) => openSheet('cart', el),
  'line-qty': (el) => { const [i, d] = el.dataset.arg.split(':').map(Number); changeLine(i, d); },
  'line-del': (el) => removeLine(Number(el.dataset.arg)),
  'send': () => sendOrder(),
  'view': (el) => goView(el.dataset.arg),
  'tip': (el) => setTip(el.dataset.arg),
  'split-mode': (el) => { state.split.mode = el.dataset.arg; refreshBillDyn(); },
  'split-n': (el) => { state.split.n = Math.min(12, Math.max(2, state.split.n + Number(el.dataset.arg))); refreshBillDyn(); },
  'people': (el) => {
    const sp = state.split;
    sp.people = Math.min(12, Math.max(2, sp.people + Number(el.dataset.arg)));
    /* Al quitar personas, sus asignaciones se borran (no reaparecen al volver a sumar) */
    Object.keys(sp.assign).forEach(k => { sp.assign[k] = sp.assign[k].filter(p => p < sp.people); });
    refreshBillDyn();
  },
  'assign': (el) => {
    const [id, p] = el.dataset.arg.split(':');
    const n = Number(p);
    const cur = (state.split.assign[id] || []).filter(x => x < state.split.people);
    state.split.assign[id] = cur.includes(n) ? cur.filter(x => x !== n) : cur.concat(n);
    refreshBillDyn();
  },
  'go-pay': () => { if (calc().canPay) { state.pay = { method: null, processing: false }; goView('pay'); } },
  'pay-method': (el) => {
    if (state.pay.processing) return;
    state.pay.method = el.dataset.arg;
    const top = scroller.scrollTop;
    keepFocus(() => { renderView(); renderBar(); });
    scroller.scrollTop = top;
    /* Lleva la explicación del método a la vista; el botón está en la barra fija */
    scroller.scrollTo({ top: scroller.scrollHeight, behavior: behavior() });
  },
  'pay-confirm': () => finishPayment(state.pay.method),
  'simulate': () => {
    if (state.pay.processing) return;
    state.pay.processing = true;
    keepFocus(renderBar);
    announce(t('processing'));
    payTimer = setTimeout(() => { if (state.view === 'pay' && state.pay.processing) finishPayment('online'); }, RM.matches ? 300 : 1400);
  },
  'restart': () => restart()
};
phone.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el, e);
});
phone.addEventListener('change', (e) => {
  if (e.target.name === 'opt' && state.draft) {
    state.draft.opt = e.target.value;
    state.draft.err = false;
    const f = $('d-opt');
    if (f) f.classList.remove('has-err');
    const er = $('d-opt-err');
    if (er) er.textContent = '';
  }
});
phone.addEventListener('input', (e) => {
  if (e.target.id === 'd-note' && state.draft) state.draft.note = e.target.value;
  if (e.target.id === 'tip-input') onTipInput(e.target.value);
});
document.addEventListener('submit', (e) => e.preventDefault());

/* Deslizar el letrero Hunters / Fishers */
let swipeX = null;
phone.addEventListener('pointerdown', (e) => { swipeX = e.target.closest('#sign') ? e.clientX : null; }, { passive: true });
phone.addEventListener('pointercancel', () => { swipeX = null; });
phone.addEventListener('pointerup', (e) => {
  if (swipeX == null) return;
  const dx = e.clientX - swipeX;
  swipeX = null;
  if (Math.abs(dx) > 36) { setSide(dx > 0 ? 'fishers' : 'hunters'); swipedAt = performance.now(); }
});

/* Teclado: Escape cierra, Tab queda atrapado en el sheet */
document.addEventListener('keydown', (e) => {
  if (!state.sheet) return;
  if (e.key === 'Escape') { e.preventDefault(); closeSheet(true); return; }
  if (e.key !== 'Tab') return;
  const f = Array.from(sheetEl.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea,[tabindex]:not([tabindex="-1"])'))
    .filter(el => !(el.type === 'radio' && !el.checked && sheetEl.querySelector(`input[name="${el.name}"]:checked`)));
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1], a = document.activeElement;
  if (e.shiftKey && (a === first || !sheetEl.contains(a) || a === $('sheet-title'))) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && (a === last || !sheetEl.contains(a))) { e.preventDefault(); first.focus(); }
});

/* Arranque */
renderAll();
window.addEventListener('resize', measureChrome);
})();
</script>
